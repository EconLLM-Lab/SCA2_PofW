[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sca2-validity"
version = "0.1.0"
description = "Minimal construct-validity profiles for SCA2: M* and [L,U] over a menu of measures (independent of cvprofiles)."
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
prep = ["pyreadstat>=1.2"]

[project.scripts]
sca2-validity = "sca2_validity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sca2_validity*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
