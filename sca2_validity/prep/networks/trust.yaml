# P1 criterion-recovery network — GPS trust as the criterion (starter template).
# AUGUSTO OWNS: threshold theta, delta, and every restriction. This file is a
# starting point for the researcher to edit, not a paper claim.
# A single signed corr_min restriction: an admissible WVS facet must correlate
# with GPS trust at least theta (signed => direction matters).
name: p1_criterion_trust_template
delta: 0.0
restrictions:
  - id: r_corr_min_gps_trust
    type: corr_min
    theta: 0.30
    params:
      variable: gps_trust
